timezone: Australia/Sydney

sharepoint_intake:
  environment: dev
  gateway_host: nexon-recon-sharepoint-dev.netbird.aaic.cc

database_mcp:
  environment: dev

profiles:
  billing_profile: nexon-recon-profile
  provider_api_profile: nexon-recon-profile

features:
  provider_api_enabled: false
  billing_query_enabled: true
  core_persistence_enabled: false
  deterministic_matching_enabled: true
  db_update_enabled: false
  failure_notifications_enabled: false

provider_api_adapters:
  equinix: true

billing:
  mode: read_only_sql
  agent_sql_allowed: true
  audit_required: true

reports:
  evidence_summary:
    auto_matched: short
    max_chars: 160

limits:
  max_zip_members: 2000
  max_single_file_mb: 250
  max_total_expanded_mb: 1000
  max_compression_ratio: 100
  fail_closed_on_unreadable_archive: true
  investigation_rows_per_batch: 100
  investigation_candidates_per_row: 20
  investigation_query_rounds: 2
  billing_query_row_limit: 5000
  billing_query_timeout_seconds: 30

failure_handling:
  notify_operator: false
  notification_mode: outlook
  notification_content: text_only

db_update_policy:
  allow_deferred_without_invoice_number: false
